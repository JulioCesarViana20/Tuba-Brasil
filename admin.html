<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Dono - Tuba Brasil</title>
    <link rel="stylesheet" href="admin.css">
</head>
<body class="admin-page">
    <header class="admin-header">
        <div class="admin-header-inner">
            <a class="admin-link" href="index.html">Loja</a>
            <h1>Painel de Produtos</h1>
            <a class="admin-link" href="cart.html">Carrinho</a>
        </div>
    </header>

    <main class="admin-main">
        <section class="admin-card">
            <p class="eyebrow">CRUD</p>
            <h2>Adicionar ou editar produto</h2>
            <form id="product-form" class="admin-form">
                <input type="hidden" id="product-id">

                <label for="product-name">Nome</label>
                <input id="product-name" name="name" required maxlength="120" placeholder="Ex: Camiseta Premium Azul">

                <label for="product-price">Preço</label>
                <input id="product-price" name="price" type="number" min="0" step="0.01" required placeholder="79.90">

                <label for="product-sizes">Tamanhos (separados por vírgula)</label>
                <input id="product-sizes" name="sizes" required placeholder="P, M, G, GG">

                <label for="product-image-file">Imagem do produto (arquivo do dispositivo)</label>
                <input id="product-image-file" name="imageFile" type="file" accept="image/*">

                <label for="product-image">Imagem vinculada</label>
                <input id="product-image" name="image" required readonly placeholder="Selecione um arquivo para upload">

                <label for="product-description">Descrição</label>
                <textarea id="product-description" name="description" rows="4" required placeholder="Descrição completa do produto"></textarea>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary" id="save-product-btn">Salvar produto</button>
                    <button type="button" class="btn btn-ghost" id="cancel-edit-btn">Cancelar edição</button>
                </div>
            </form>
            <p id="admin-feedback" class="feedback" aria-live="polite"></p>
        </section>

        <section class="admin-card">
            <h2>Produtos cadastrados</h2>
            <div class="table-wrap">
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>Produto</th>
                            <th>Preço</th>
                            <th>Tamanhos</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="admin-products-body"></tbody>
                </table>
            </div>
        </section>
    </main>

    <a class="floating-whatsapp" href="https://wa.me/556282801375?text=Ol%C3%A1%2C%20sou%20o%20dono%20da%20loja%20e%20preciso%20de%20suporte" target="_blank" rel="noopener" aria-label="Suporte no WhatsApp">
        <img src="img/whatsapp.png" alt="WhatsApp">
    </a>

    <script src="src/script.js"></script>
</body>
</html>
